name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Codespace Running
        run: |
          # Start codespace if stopped
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/codespaces/fuzzy-broccoli-q7rp59prrvvvc6g75/start" || true

          sleep 5

          # Ping to reset idle timer
          curl -s \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/codespaces/fuzzy-broccoli-q7rp59prrvvvc6g75" > /tmp/status.json

          echo "Codespace status:"
          cat /tmp/status.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('State:', d.get('state'))"
